# Adoption, not a fresh install — ingress-nginx was already running
# (installed imperatively by infra/up.ps1) before this Application existed.
# Pinned to 4.15.1 because that's the exact chart version already live
# (`helm list -n ingress-nginx`) — this migration is a pure ownership
# change, not bundled with an incidental version bump.
#
# Verified clean before enabling automated sync: applied with no
# syncPolicy.automated first, confirmed status.sync.status was "Synced"
# with zero operationState (no sync ever ran) and all 11 resources
# individually "Synced" — genuine zero-diff adoption, not a lucky-looking
# aggregate status. Automated enabled only after that confirmation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: "4.15.1"
      helm:
        valueFiles:
          - $values/infra/ingress/ingress-nginx-values.yaml
    - repoURL: https://github.com/TomKoren1/website-ai-builder.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
