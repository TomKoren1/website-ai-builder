# Helm values for ingress-nginx, tuned for a single-node Kind cluster.
#
# Why hostPort instead of a LoadBalancer Service: Kind doesn't provision
# real cloud load balancers, so a `type: LoadBalancer` Service would sit
# in <pending> forever. Binding the controller pod's 80/443 directly to
# the node's 80/443 (which Kind then maps to the host via kind-config.yaml)
# is the standard way to get real traffic into an ingress-nginx-on-Kind setup.
controller:
  hostPort:
    enabled: true
  # Same lesson as infra/gitea/values.yaml's `strategy: Recreate` comment,
  # hitting the same underlying cause here: this controller binds the
  # node's own 80/443 directly (hostPort, see above) on a single-node Kind
  # cluster. Default RollingUpdate tries to schedule the new pod *before*
  # killing the old one — but there's only one node, and the old pod is
  # still holding those ports, so the new pod sits Pending forever
  # ("0/1 nodes are available: didn't have free ports") while the OLD pod
  # (with whatever args/config predates this values change) keeps serving
  # all traffic. Recreate kills the old pod first, freeing the ports.
  updateStrategy:
    type: Recreate
  service:
    type: ClusterIP
  nodeSelector:
    ingress-ready: "true"
    kubernetes.io/os: linux
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      effect: NoSchedule
  # Single replica: this is a learning cluster, not HA production.
  replicaCount: 1
  admissionWebhooks:
    enabled: true
  # Any request whose Host header doesn't match app.local/localstack.local/
  # gitea.local's Ingress rules falls through here instead of nginx's
  # built-in 404 default backend — this is how a friend's custom domain
  # actually resolves to their site (see overview.md correction #1: no
  # Ingress rule can be pre-created per custom domain, since domains are
  # added by users at runtime, long after this chart is installed).
  # Requires infra/ingress/manifests/app-ingress.yaml's `reverse-proxy`
  # Service to already exist — apply that (or let Argo CD sync it) before
  # `helm upgrade`ing this, or nginx will just have an unreachable default
  # backend until it does.
  extraArgs:
    default-backend-service: "ai-builder/reverse-proxy"
