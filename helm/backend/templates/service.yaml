apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "backend.labels" . | nindent 4 }}
  ports:
    - name: http # named so the ServiceMonitor (templates/servicemonitor.yaml) can reference it — Prometheus Operator matches by port name, not number
      port: {{ .Values.service.port }}
      targetPort: 8000
